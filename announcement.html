<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzzer Sound Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .buzzer-button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .buzzer-button:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>
    <q><i>my dear team ,,, As the occassion of valentine day on feb 14 ,nptel team decided to end exam registration on that day<br> so we should register to it ,If don't we know the consequences</i></q></h1>
    <audio id="buzzer" src="buzzer.mp3" preload="auto"></audio>
    <button class="buzzer-button" onclick="document.getElementById('buzzer').play();">Click on me!! to not to forgot</button>
</body>
</html>
